spring:
  application.name: kanban-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/kanban_db?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jackson.default-property-inclusion: non_null
server.port: ${PORT:8081}
app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-key-to-a-secure-32-byte-minimum-value}
    access-ms: ${JWT_ACCESS_MS:900000}
    refresh-ms: ${JWT_REFRESH_MS:604800000}
  cors.allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
springdoc.swagger-ui.path: /swagger-ui.html
